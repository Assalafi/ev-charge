<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EV Charge - Smart EV Charging App by African Motor Works. Find charging stations, manage your EV charging sessions, and track your energy usage across Nigeria.">
  <meta name="keywords" content="EV charging, electric vehicle, charging stations, Nigeria, African Motor Works, e-ride, EV Charge, electric car charging">
  <meta name="author" content="African Motor Works">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://evcharge.eride.ng">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://evcharge.eride.ng">
  <meta property="og:title" content="EV Charge - Smart EV Charging App">
  <meta property="og:description" content="Find and manage EV charging stations across Nigeria. Track your energy usage, payments, and charging history with the official EV Charge app by African Motor Works.">
  <meta property="og:image" content="https://evcharge.eride.ng/icons/Icon-512.png">
  <meta property="og:site_name" content="EV Charge">
  <meta property="og:locale" content="en_NG">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://evcharge.eride.ng">
  <meta name="twitter:title" content="EV Charge - Smart EV Charging App">
  <meta name="twitter:description" content="Find and manage EV charging stations across Nigeria. Track your energy usage, payments, and charging history.">
  <meta name="twitter:image" content="https://evcharge.eride.ng/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EV Charge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EV Charge</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
