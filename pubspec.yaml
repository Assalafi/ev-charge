name: ev_charge
description: EV Charge - AMW - Smart EV Charging App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^0.13.5
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  google_fonts: ^4.0.4
  mobile_scanner: ^4.0.1
  shimmer: ^3.0.0
  intl: ^0.17.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.0
  flutter_paystack: ^1.0.7
  local_auth: ^2.1.6
  url_launcher: ^6.2.2
  geolocator: ^10.1.0
  package_info_plus: ^4.2.0
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1B2150"
    theme_color: "#1B2150"
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1B2150"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
