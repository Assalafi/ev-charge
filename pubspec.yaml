name: ev_charge
description: EV Charge - AMW - Smart EV Charging App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  google_fonts: ^8.1.0
  mobile_scanner: ^7.2.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.0
  local_auth: ^3.0.1
  url_launcher: ^6.2.2
  geolocator: ^14.0.3
  package_info_plus: ^10.1.0
  webview_flutter: ^4.4.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1B2150"
    theme_color: "#1B2150"
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1B2150"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
